; 배액 측정기 펌웨어 0.9 - PlatformIO 설정
; VS Code + PlatformIO로 이 폴더(DrainMeter)를 연다.
;
; XIAO ESP32C6는 PlatformIO 기본 플랫폼(espressif32)으로는 아두이노 3.x가 안 된다.
; 커뮤니티 플랫폼 pioarduino를 쓴다. 처음 빌드 때 내려받느라 몇 분 걸린다.
; 오류가 계속 나면 사용자 폴더의 .platformio 폴더를 지우고 VS Code를 다시 시작한다.

[platformio]
src_dir = .
default_envs = drainmeter

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; USB 직결 포트로 시리얼을 쓴다
build_flags = -I. -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2
    olikraus/U8g2_for_Adafruit_GFX
    adafruit/RTClib

; 본 펌웨어 (지금은 뼈대만 있다)
[env:drainmeter]
extends = common
build_src_filter = +<*.cpp> +<*.ino> -<hwtest/>

; ---- 부품 시험용. 하나씩 올려서 확인한다 (README "부품 시험" 참고) ----

; 로드셀 2세트 (HX711 2개, 클럭 공용)
; 빌드와 업로드: pio run -e test_scale -t upload
[env:test_scale]
extends = common
build_src_filter = +<dev_Scale.cpp> +<hwtest/test_scale.cpp>

; RTC (DS3231) 시간 읽기와 맞추기, I2C 장치 찾기
; 빌드와 업로드: pio run -e test_rtc -t upload
[env:test_rtc]
extends = common
build_src_filter = +<hwtest/test_rtc.cpp>

; 전자잉크 2.9인치 흑백, 한글 표시와 갱신 시간
; 빌드와 업로드: pio run -e test_epd -t upload
[env:test_epd]
extends = common
build_src_filter = +<hwtest/test_epd.cpp>
