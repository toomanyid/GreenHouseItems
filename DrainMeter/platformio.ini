; 배액 측정기 펌웨어 0.9 - PlatformIO 설정
; VS Code + PlatformIO로 이 폴더(DrainMeter)를 연다.
;
; XIAO ESP32C6는 PlatformIO 기본 플랫폼(espressif32)으로는 아두이노 3.x가 안 된다.
; 커뮤니티 플랫폼 pioarduino를 쓴다. 처음 빌드 때 내려받느라 몇 분 걸린다.
; 오류가 계속 나면 사용자 폴더의 .platformio 폴더를 지우고 VS Code를 다시 시작한다.

[platformio]
src_dir = .
default_envs = drainmeter

[common]
; 판을 55.03.311로 고정한다. 그 뒤 판(55.03.312~)은 PlatformIO 6.2.0 이상을 요구하는데,
; PlatformIO 6.2.0이 스스로를 "6.2.0.post1"로 알려서 버전 검사에 걸린다.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; 시리얼 모니터: 엔터를 칠 때 한 줄을 한 번에 보내고, 친 글자를 화면에 보여 준다
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
; USB 직결 포트로 시리얼을 쓴다
build_flags = -I. -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2
    olikraus/U8g2_for_Adafruit_GFX
    adafruit/RTClib

; 본 펌웨어 (지금은 뼈대만 있다)
[env:drainmeter]
extends = common
build_src_filter = +<*.cpp> +<*.ino> -<hwtest/>

; ---- 부품 시험용. 하나씩 올려서 확인한다 (README "부품 시험" 참고) ----

; 로드셀 2세트 (HX711 2개, 클럭 공용)
; 빌드와 업로드: pio run -e test_scale -t upload
[env:test_scale]
extends = common
build_src_filter = +<dev_Scale.cpp> +<io_Calib.cpp> +<hwtest/test_scale.cpp>

; RTC (DS3231) 시간 읽기와 맞추기, I2C 장치 찾기
; 빌드와 업로드: pio run -e test_rtc -t upload
[env:test_rtc]
extends = common
build_src_filter = +<hwtest/test_rtc.cpp>

; 전자잉크 2.9인치 흑백, 한글 표시와 갱신 시간
; 빌드와 업로드: pio run -e test_epd -t upload
[env:test_epd]
extends = common
build_src_filter = +<hwtest/test_epd.cpp>

; 저울 + 전자잉크: 지금 무게를 1초마다 화면에 보인다
; 빌드와 업로드: pio run -e test_live -t upload
[env:test_live]
extends = common
build_src_filter = +<dev_Scale.cpp> +<io_Calib.cpp> +<hwtest/test_live.cpp>
