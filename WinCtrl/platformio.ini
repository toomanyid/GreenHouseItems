; 측창 모터 제어기 펌웨어 0.9 - PlatformIO 설정
; 아두이노 IDE로 이 폴더(WinCtrl)를 열어도 되고, VS Code + PlatformIO로 열어도 된다.
; 주의: 이 파일은 만든 곳에서 빌드해 보지 못했다. 처음 빌드에서 오류가 나면 알려 주세요.

[platformio]
src_dir = .
default_envs = winctrl

[env:winctrl]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8: 플래시 16MB, PSRAM 8MB (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; 맨 위 폴더의 소스만 빌드한다 (test 폴더 제외)
build_src_filter = +<*.cpp> +<*.ino> -<test/>
build_flags = -I.
monitor_speed = 115200

; 책상 시험용 (24V 없이): 릴레이 뒤 전압 점검을 끈다. 현장 설치에 쓰지 않는다.
; 빌드: pio run -e winctrl_bench -t upload
[env:winctrl_bench]
extends = env:winctrl
build_flags = ${env:winctrl.build_flags} -DWINCTRL_BENCH

; UI 시험용 (LCD와 엔코더만): 모터, 릴레이, 비상정지, 전류, 원점 센서, 온도를 가짜 값으로 돌린다.
; 모터와 릴레이 핀은 움직이지 않는다 (dev_Sim.h). 현장 설치에 쓰지 않는다.
; 빌드: pio run -e winctrl_ui -t upload
[env:winctrl_ui]
extends = env:winctrl
build_flags = ${env:winctrl.build_flags} -DWINCTRL_UISIM
