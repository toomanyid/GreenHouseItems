; 측창 모터 제어기 펌웨어 0.9 - PlatformIO 설정
; 아두이노 IDE로 이 폴더(WinCtrl)를 열어도 되고, VS Code + PlatformIO로 열어도 된다.
; 주의: 이 파일은 만든 곳에서 빌드해 보지 못했다. 처음 빌드에서 오류가 나면 알려 주세요.

[platformio]
src_dir = .
default_envs = winctrl

[env:winctrl]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8: 플래시 16MB, PSRAM 8MB (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; 맨 위 폴더의 소스만 빌드한다 (test, hwtest 폴더 제외)
build_src_filter = +<*.cpp> +<*.ino> -<test/> -<hwtest/>
build_flags = -I.
monitor_speed = 115200

; 책상 시험용 (24V 없이): MC 뒤 전압 점검을 끈다. 현장 설치에 쓰지 않는다.
; 빌드: pio run -e winctrl_bench -t upload
[env:winctrl_bench]
extends = env:winctrl
build_flags = ${env:winctrl.build_flags} -DWINCTRL_BENCH

; UI 시험용 (LCD와 엔코더만): 모터, MC, 비상정지, 전류, 원점 센서, 온도를 가짜 값으로 돌린다.
; 모터와 MC FET 핀은 움직이지 않는다 (dev_Sim.h). 현장 설치에 쓰지 않는다.
; 빌드: pio run -e winctrl_ui -t upload
[env:winctrl_ui]
extends = env:winctrl
build_flags = ${env:winctrl.build_flags} -DWINCTRL_UISIM

; PCB 첫 연결 시험: 출력 핀을 LOW로 묶고 I2C, LCD, 엔코더, 입력 핀, 납땜 붙음을 본다.
; 본 펌웨어가 아니다. 시리얼 115200bps에서 p, i, b, l, w, h 명령. u, d로 모터2를 1초 돌린다.
; 빌드: pio run -e test_pcb -t upload
[env:test_pcb]
extends = env:winctrl
build_src_filter = +<dev_Lcd.cpp> +<dev_Encoder.cpp> +<dev_MotorDriver.cpp> +<hwtest/test_pcb.cpp>

; LCD 시험: 화면이 안 보일 때 I2C 백팩, LCD 컨트롤러(되읽기), 대비, 백라이트 중 어디인지 가른다.
; 모터와 MC FET 핀은 켜자마자 LOW로 묶고 건드리지 않는다. 시리얼 명령은 h.
; 빌드: pio run -e test_lcd -t upload
[env:test_lcd]
extends = env:winctrl
build_src_filter = +<dev_Lcd.cpp> +<hwtest/test_lcd.cpp>
