; 측창 모터 제어기 펌웨어 0.9 - PlatformIO 설정
; 아두이노 IDE로 이 폴더(WinCtrl)를 열어도 되고, VS Code + PlatformIO로 열어도 된다.
; 주의: 이 파일은 만든 곳에서 빌드해 보지 못했다. 처음 빌드에서 오류가 나면 알려 주세요.

[platformio]
src_dir = .
default_envs = winctrl

[env:winctrl]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8: 플래시 16MB, PSRAM 8MB (OPI)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; 맨 위 폴더의 소스만 빌드한다 (test 폴더 제외)
build_src_filter = +<*.cpp> +<*.ino> -<test/>
build_flags = -I.
monitor_speed = 115200
